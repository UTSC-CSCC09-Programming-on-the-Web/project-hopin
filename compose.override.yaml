services:
  frontend:
    build:
      dockerfile: Dockerfile
    target:
      - dev
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
        - action: rebuild
          path: ./frontend/package.json

  backend:
    build:
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.local
    ports:
      - "8080:8080"
    target:
      - dev
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
        - action: rebuild
          path: ./backend/package.json
  postgres:
    ports:
      - "5432:5432"

  cache:
    ports:
      - "6379:6379"
    command: ["redis-server", "--loglevel", "warning"]
