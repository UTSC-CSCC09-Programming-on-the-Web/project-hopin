services:
  frontend:
    build:
      context: ./frontend
    networks:
      - appnet

  backend:
    build:
      context: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
    networks:
      - appnet
      - dbnet

  migrate:
    build: .
    command: npx prisma migrate deploy
    # environment:
    #   - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/myapp_prod
    depends_on:
      postgres:

  postgres:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dbnet

  cache:
    image: redis:latest
    networks:
      - dbnet

volumes:
  postgres_data:

networks:
  appnet:
  dbnet:
